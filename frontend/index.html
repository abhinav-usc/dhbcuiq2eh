<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Day-ahead wind forecast desk: the forecast at the auction gate, and how accurate it is." />
    <meta name="theme-color" content="#f1f1ee" />
    <title>Anemo · Day-ahead wind desk</title>
    <script>
      // Pick the theme before first paint (saved choice, else the OS setting)
      // so dark-mode visitors never see a white flash. src/hooks/useTheme.ts
      // takes over once React loads
      ;(function () {
        var theme = null
        try {
          theme = localStorage.getItem('anemo-theme')
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.dataset.theme = theme
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
